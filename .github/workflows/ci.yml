# Every push: compile Shot.ps1 and run its self-check on Windows PowerShell 5.1.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-check
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\Shot.ps1 -Test
